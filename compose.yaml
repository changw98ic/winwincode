name: winwincode-community

services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: winwincode-server:${WWC_VERSION:-0.2.0}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WWC_SERVER_PORT:-8443}:8443"
    environment:
      WWC_SERVER_BIND: 0.0.0.0:8443
      WWC_SERVER_PUBLIC_URL: http://127.0.0.1:${WWC_SERVER_PORT:-8443}
      WWC_SERVER_ALLOWED_ORIGINS: http://127.0.0.1:${WWC_WEB_PORT:-8080}
      WWC_SERVER_AUTH_MODE: local-open
      WWC_SERVER_DATA_DIRECTORY: /var/lib/winwincode
      WWC_SERVER_REPOSITORY_ROOT: /workspace/repository
    volumes:
      - backend-data:/var/lib/winwincode
      - ${WWC_SERVER_REPOSITORY_ROOT:-.}:/workspace/repository
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: winwincode-client-web:${WWC_VERSION:-0.2.0}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WWC_WEB_PORT:-8080}:8080"
    environment:
      WWC_SERVER_URL: http://127.0.0.1:${WWC_SERVER_PORT:-8443}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  backend-data:
