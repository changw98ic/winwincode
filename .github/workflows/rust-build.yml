name: Rust build lane

on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      producer_attempt:
        value: ${{ jobs.build.outputs.producer_attempt }}
      archive_sha256:
        value: ${{ jobs.build.outputs.archive_sha256 }}

permissions:
  contents: read

jobs:
  build:
    name: rust-${{ inputs.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      producer_attempt: ${{ steps.produce.outputs.producer_attempt }}
      archive_sha256: ${{ steps.produce.outputs.archive_sha256 }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      RUSTC_WRAPPER: "sccache"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_GHA_VERSION: mainline-Linux-X64-debug-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}
      SCCACHE_LOG: sccache::server=debug
      WWC_RUST_CACHE: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/install-code-mode-linux-build-deps.sh
          printf 'LIBCLANG_PATH=/usr/lib/llvm-23/lib\n' >> "${GITHUB_ENV}"
          printf 'CLANG_BASE_PATH=/usr/lib/llvm-23\n' >> "${GITHUB_ENV}"
          printf 'CLANG_PATH=/usr/lib/llvm-23/bin/clang\n' >> "${GITHUB_ENV}"
          printf '/usr/lib/llvm-23/bin\n' >> "${GITHUB_PATH}"
          if [[ ! -e /usr/local/bin/ld.lld ]]; then
            if [[ -x /usr/lib/llvm-23/bin/ld.lld ]]; then
              sudo ln -sf /usr/lib/llvm-23/bin/ld.lld /usr/local/bin/ld.lld
            else
              sudo ln -sf "$(command -v ld.lld-23)" /usr/local/bin/ld.lld
            fi
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rust-src
          rustup override set 1.95.0
          rustc -Vv
          cargo -V

      - name: Configure private compiler cache diagnostics
        shell: bash
        run: printf 'SCCACHE_ERROR_LOG=%s/sccache.log\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Install persistent Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: "v0.17.0"

      - name: Wire C/C++ compiler cache
        shell: bash
        run: |
          set -euo pipefail
          sccache_bin=$(command -v sccache)
          printf 'SCCACHE=%s\n' "${sccache_bin}" >> "${GITHUB_ENV}"
          printf 'CC_WRAPPER=%s\n' "${sccache_bin}" >> "${GITHUB_ENV}"
          printf 'CC=%s\n' "${CLANG_PATH}" >> "${GITHUB_ENV}"
          printf 'CXX=%s++\n' "${CLANG_PATH}" >> "${GITHUB_ENV}"

      - name: Install cargo-nextest
        if: ${{ inputs.lane == 'archive' }}
        uses: ./.github/actions/setup-nextest

      - name: Materialize V8 cache identity
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'GN_ARGS=%s\n' 'is_debug=false icu_use_data_file=true icu_copy_icudata_to_root_build_dir=false v8_enable_temporal_support=false'
            "${CLANG_PATH}" --version
          } > .github/v8-cache-identity.txt

      - name: Cache pinned V8 source build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/debug/gn_out
            target/**/gn_out
          key: v8-gn-v2-${{ inputs.lane }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/code-mode-ninja.mjs', 'scripts/install-code-mode-linux-build-deps.sh', '.github/v8-cache-identity.txt') }}

      - name: Lint Rust workspace
        if: ${{ inputs.lane == 'lint' }}
        shell: bash
        run: |
          corepack enable
          corepack pnpm lint:rust

      - name: Verify archive relocation without compilers
        if: ${{ inputs.lane == 'archive' }}
        env:
          WWC_NEXTEST_INTEGRATION: "1"
        run: node --experimental-test-module-mocks --test --test-concurrency=1 tests/rust-test-archive.test.mjs

      - name: Build shared Rust test archive
        id: produce
        if: ${{ inputs.lane == 'archive' }}
        run: node scripts/rust-test-archive.mjs produce

      - name: Upload shared Rust test archive
        id: upload
        if: ${{ inputs.lane == 'archive' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-tests-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-Linux-X64
          path: .cache/rust-test-archive/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

      - name: Build and verify Rust products
        if: ${{ inputs.lane == 'runtime' }}
        shell: bash
        run: |
          corepack enable
          corepack pnpm build:rust
          node scripts/verify-products.mjs --scope rust

      - name: Verify API production vertical
        if: ${{ inputs.lane == 'runtime' }}
        shell: bash
        run: corepack pnpm verify:api-production-vertical

      - name: Verify shared Device product Sessions
        if: ${{ inputs.lane == 'runtime' }}
        shell: bash
        run: corepack pnpm verify:api-production-sessions

      - name: Report safe compiler cache diagnostics
        if: ${{ always() }}
        run: node scripts/report-sccache-errors.mjs
