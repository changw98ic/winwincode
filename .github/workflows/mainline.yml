name: Mainline verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mainline-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source format and boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Verify source once
        shell: bash
        run: |
          corepack enable
          corepack pnpm verify:source

  typescript:
    name: TypeScript build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify TypeScript once
        shell: bash
        run: corepack pnpm verify:typescript

  rust:
    name: rust-${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane:
          - lint
          - test
          - runtime
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils bubblewrap pkg-config libcap-dev
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rust-src
          rustup override set 1.95.0
          rustc -Vv
          cargo -V

      - name: Install persistent Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Lint Rust workspace
        if: ${{ matrix.lane == 'lint' }}
        shell: bash
        run: |
          corepack enable
          corepack pnpm lint:rust

      - name: Test Rust workspace
        if: ${{ matrix.lane == 'test' }}
        shell: bash
        run: |
          corepack enable
          corepack pnpm test:rust

      - name: Build and verify Rust products
        if: ${{ matrix.lane == 'runtime' }}
        shell: bash
        run: |
          corepack enable
          corepack pnpm build:rust
          node scripts/verify-products.mjs --scope rust

      - name: Verify API production vertical
        if: ${{ matrix.lane == 'runtime' }}
        shell: bash
        run: corepack pnpm verify:api-production-vertical

  verify:
    name: Canonical workspace verification
    if: ${{ always() }}
    needs:
      - source
      - typescript
      - rust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every independent lane to pass
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${SOURCE_RESULT}" = "success"
          test "${TYPESCRIPT_RESULT}" = "success"
          test "${RUST_RESULT}" = "success"
