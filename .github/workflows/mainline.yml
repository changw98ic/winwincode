name: Mainline verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mainline-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source format and boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Verify source once
        shell: bash
        run: |
          corepack enable
          corepack pnpm verify:source

  typescript:
    name: TypeScript build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify TypeScript once
        shell: bash
        run: corepack pnpm verify:typescript

  rust:
    name: rust-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [lint, runtime]
    uses: ./.github/workflows/rust-build.yml
    with:
      lane: ${{ matrix.lane }}

  rust-test-build:
    name: Rust test producer
    uses: ./.github/workflows/rust-build.yml
    with:
      lane: archive

  rust-tests:
    name: rust-${{ matrix.lane }}
    needs: rust-test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [test, e2e]
    env:
      CI: "1"
    steps:
      - name: Check out identical source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install test runtime dependencies and verify sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bubblewrap libcap2
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install cargo-nextest
        uses: ./.github/actions/setup-nextest

      - name: Download this run's Rust test archive
        uses: actions/download-artifact@v8
        with:
          name: rust-tests-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-Linux-X64
          path: .cache/rust-test-archive/

      - name: Run original Rust test selection without compiling
        run: node scripts/rust-test-archive.mjs ${{ matrix.lane }}

  verify:
    name: Canonical workspace verification
    if: ${{ always() }}
    needs:
      - source
      - typescript
      - rust
      - rust-test-build
      - rust-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every independent lane to pass
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          ARCHIVE_RESULT: ${{ needs.rust-test-build.result }}
          TESTS_RESULT: ${{ needs.rust-tests.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${SOURCE_RESULT}" = "success"
          test "${TYPESCRIPT_RESULT}" = "success"
          test "${RUST_RESULT}" = "success"
          test "${ARCHIVE_RESULT}" = "success"
          test "${TESTS_RESULT}" = "success"
