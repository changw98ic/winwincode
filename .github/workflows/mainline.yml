name: Mainline verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mainline-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Canonical workspace verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils bubblewrap pkg-config libcap-dev
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,rust-src
          rustup override set 1.95.0
          rustc -Vv
          cargo -V

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify the exact commit once
        shell: bash
        run: corepack pnpm verify
