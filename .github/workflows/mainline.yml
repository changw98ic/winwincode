name: Mainline verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mainline-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source format and boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Verify source once
        shell: bash
        run: |
          corepack enable
          corepack pnpm verify:source

  typescript:
    name: TypeScript build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify TypeScript once
        shell: bash
        run: corepack pnpm verify:typescript

  rust:
    name: rust-lint
    uses: ./.github/workflows/rust-build.yml
    with:
      lane: lint

  rust-runtime-build:
    name: Rust runtime producer
    uses: ./.github/workflows/rust-build.yml
    with:
      lane: runtime

  rust-runtime-sessions:
    name: runtime-sessions-${{ matrix.group }}
    needs: rust-runtime-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [load, api, recovery, boundaries]
    env:
      CI: "1"
      WWC_API_SKIP_BUILD: "1"
      WWC_CODE_MODE_ACCEPTANCE_BIN_DIR: ${{ github.workspace }}/target/debug
      WWC_CLI_BINARY: ${{ github.workspace }}/target/debug/wwc
      WWC_RUNTIME_PRODUCER_ATTEMPT: ${{ needs.rust-runtime-build.outputs.producer_attempt }}
      WWC_RUNTIME_ARCHIVE_SHA256: ${{ needs.rust-runtime-build.outputs.archive_sha256 }}
    steps:
      - name: Check out identical source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install runtime dependencies and verify sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/runtime-sessions"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bubblewrap libcap2
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Download exact producer runtime products
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.rust-runtime-build.outputs.artifact_id }}
          path: .cache/runtime-products/

      - name: Restore canonical runtime products and verify original source seal
        run: node scripts/runtime-products.mjs restore

      - name: Verify shared Device product Sessions without compiling
        env:
          TMPDIR: ${{ runner.temp }}/runtime-sessions
        shell: bash
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/no-runtime-compilers"
          mkdir -p "${tools}"
          for compiler in cargo rustc; do
            printf '#!/bin/sh\nprintf "Unexpected runtime compilation\\n" >&2\nexit 91\n' > "${tools}/${compiler}"
            chmod +x "${tools}/${compiler}"
          done
          export PATH="${tools}:${PATH}"
          node scripts/run-api-production-sessions.mjs --group ${{ matrix.group }} 2>&1 | tee "${RUNNER_TEMP}/runtime-sessions.log"

      - name: Collect safe failed scenario diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}/runtime-sessions
        run: node scripts/collect-runtime-diagnostics.mjs

      - name: Retain failed scenario diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-diagnostics-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/runtime-diagnostics/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  rust-test-build:
    name: Rust test producer
    uses: ./.github/workflows/rust-build.yml
    with:
      lane: archive

  rust-tests:
    name: rust-${{ matrix.lane }}
    needs: rust-test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [test, e2e]
    env:
      CI: "1"
      WWC_RUST_TEST_PRODUCER_ATTEMPT: ${{ needs.rust-test-build.outputs.producer_attempt }}
      WWC_RUST_TEST_ARCHIVE_SHA256: ${{ needs.rust-test-build.outputs.archive_sha256 }}
    steps:
      - name: Check out identical source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install test runtime dependencies and verify sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bubblewrap libcap2
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install cargo-nextest
        uses: ./.github/actions/setup-nextest

      - name: Download this run's Rust test archive
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.rust-test-build.outputs.artifact_id }}
          path: .cache/rust-test-archive/

      - name: Run original Rust test selection without compiling
        run: node scripts/rust-test-archive.mjs ${{ matrix.lane }}

  verify:
    name: Canonical workspace verification
    if: ${{ always() }}
    needs:
      - source
      - typescript
      - rust
      - rust-runtime-build
      - rust-runtime-sessions
      - rust-test-build
      - rust-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every independent lane to pass
        env:
          RUNTIME_BUILD_RESULT: ${{ needs.rust-runtime-build.result }}
          RUNTIME_SESSIONS_RESULT: ${{ needs.rust-runtime-sessions.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ARCHIVE_RESULT: ${{ needs.rust-test-build.result }}
          TESTS_RESULT: ${{ needs.rust-tests.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${SOURCE_RESULT}" = "success"
          test "${TYPESCRIPT_RESULT}" = "success"
          test "${RUST_RESULT}" = "success"
          test "${RUNTIME_BUILD_RESULT}" = "success"
          test "${RUNTIME_SESSIONS_RESULT}" = "success"
          test "${ARCHIVE_RESULT}" = "success"
          test "${TESTS_RESULT}" = "success"
