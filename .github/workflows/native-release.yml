name: Product release matrix

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit with a successful Mainline verification push run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: product-release-${{ github.workflow }}-${{ inputs.source_commit }}
  cancel-in-progress: true

jobs:
  verify-source:
    name: Verify successful mainline source
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Reject a non-default-branch workflow definition
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "${SELECTED_REF}" = "refs/heads/${DEFAULT_BRANCH}"

      - name: Check out the trusted verifier
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify exact successful mainline push
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          node scripts/verify-mainline-release-source.mjs \
            --source-commit "${SOURCE_COMMIT}" \
            --default-branch "${DEFAULT_BRANCH}"
          printf 'source_commit=%s\n' "${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"

  product-release:
    name: ${{ matrix.target }}
    needs: verify-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            timeout_minutes: 120
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            timeout_minutes: 300
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            timeout_minutes: 120
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            timeout_minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      SOURCE_COMMIT: ${{ needs.verify-source.outputs.source_commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils bubblewrap pkg-config libcap-dev
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,rust-src
          rustup target add "${{ matrix.target }}" --toolchain 1.95.0
          rustup override set 1.95.0
          rustc -Vv
          cargo -V

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Build product release artifacts and write evidence
        shell: bash
        env:
          WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX }}
          WINWINCODE_HELPER_RELEASE_PUBLIC_KEY_HEX: ${{ vars.WINWINCODE_HELPER_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          node scripts/run-release-artifact-gate.mjs \
            --target ${{ matrix.target }} \
            --source-commit "${SOURCE_COMMIT}" \
            --source-date-epoch "$(git show -s --format=%ct "${SOURCE_COMMIT}")" \
            --output release-artifacts

      - name: Verify release artifact security
        id: security
        continue-on-error: true
        shell: bash
        env:
          WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/helper-release-private-input"
          umask 077
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "${WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX}" > "$key_file"
          node scripts/verify-release-artifact-security.mjs \
            --target "${{ matrix.target }}" \
            --expected-commit "${SOURCE_COMMIT}" \
            --source-date-epoch "$(git show -s --format=%ct "${SOURCE_COMMIT}")" \
            --evidence release-artifacts \
            --output release-artifact-security-report.json \
            --sensitive-input "$key_file"

      - name: Upload release artifact security report
        if: ${{ always() && steps.security.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-security-${{ matrix.target }}
          path: release-artifact-security-report.json
          if-no-files-found: error

      - name: Upload release artifacts
        if: ${{ steps.security.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: release-artifacts/${{ matrix.target }}/
          if-no-files-found: error

      - name: Enforce release artifact security
        if: ${{ always() && steps.security.outcome != 'skipped' }}
        shell: bash
        env:
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
        run: |
          set -euo pipefail
          test "${SECURITY_OUTCOME}" = "success"
