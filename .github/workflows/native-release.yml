name: Product release matrix

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit with a successful Mainline verification push run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: product-release-${{ github.workflow }}-${{ inputs.source_commit }}
  cancel-in-progress: true

jobs:
  verify-source:
    name: Verify successful mainline source
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Reject a non-default-branch workflow definition
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "${SELECTED_REF}" = "refs/heads/${DEFAULT_BRANCH}"

      - name: Check out the trusted verifier
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify exact successful mainline push
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          node scripts/verify-mainline-release-source.mjs \
            --source-commit "${SOURCE_COMMIT}" \
            --default-branch "${DEFAULT_BRANCH}"
          printf 'source_commit=%s\n' "${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"

  product-release:
    name: ${{ matrix.target }}
    needs: verify-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            timeout_minutes: 120
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            timeout_minutes: 300
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            timeout_minutes: 120
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            timeout_minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      SOURCE_COMMIT: ${{ needs.verify-source.outputs.source_commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils bubblewrap pkg-config libcap-dev
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,rust-src
          rustup target add "${{ matrix.target }}" --toolchain 1.95.0
          rustup override set 1.95.0
          rustc -Vv
          cargo -V

      - name: Install persistent Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Build product release artifacts and write evidence
        shell: bash
        env:
          WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX }}
          WINWINCODE_HELPER_RELEASE_PUBLIC_KEY_HEX: ${{ vars.WINWINCODE_HELPER_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          node scripts/run-release-artifact-gate.mjs \
            --target ${{ matrix.target }} \
            --source-commit "${SOURCE_COMMIT}" \
            --source-date-epoch "$(git show -s --format=%ct "${SOURCE_COMMIT}")" \
            --output release-artifacts

      - name: Verify release artifact security
        id: security
        continue-on-error: true
        shell: bash
        env:
          WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/helper-release-private-input"
          umask 077
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "${WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX}" > "$key_file"
          node scripts/verify-release-artifact-security.mjs \
            --target "${{ matrix.target }}" \
            --expected-commit "${SOURCE_COMMIT}" \
            --source-date-epoch "$(git show -s --format=%ct "${SOURCE_COMMIT}")" \
            --evidence release-artifacts \
            --output release-artifact-security-report.json \
            --sensitive-input "$key_file"

      - name: Upload release artifact security report
        if: ${{ always() && steps.security.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-security-${{ matrix.target }}
          path: release-artifact-security-report.json
          if-no-files-found: error

      - name: Upload release artifacts
        if: ${{ steps.security.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: release-artifacts/${{ matrix.target }}/
          if-no-files-found: error

      - name: Stage Community Core Worker runtime
        if: ${{ steps.security.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm release:core-worker \
            --artifact-root "release-artifacts/${{ matrix.target }}" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-date-epoch "$(git show -s --format=%ct "${SOURCE_COMMIT}")" \
            --target "${{ matrix.target }}" \
            --output "community-core-worker/${{ matrix.target }}"

      - name: Upload Community Core Worker runtime
        if: ${{ steps.security.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: community-core-worker-${{ matrix.target }}
          path: community-core-worker/${{ matrix.target }}/
          if-no-files-found: error

      - name: Enforce release artifact security
        if: ${{ always() && steps.security.outcome != 'skipped' }}
        shell: bash
        env:
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
        run: |
          set -euo pipefail
          test "${SECURITY_OUTCOME}" = "success"

  community-core-candidate:
    name: Assemble signed Community Core candidate
    needs:
      - verify-source
      - product-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      SOURCE_COMMIT: ${{ needs.verify-source.outputs.source_commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0

      - name: Install package tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Download verified Worker inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/community-core-workers"
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu
          do
            gh run download "${{ github.run_id }}" \
              --name "community-core-worker-${target}" \
              --dir "${RUNNER_TEMP}/community-core-workers/${target}"
            chmod 0755 \
              "${RUNNER_TEMP}/community-core-workers/${target}/bin/winwincode-worker" \
              "${RUNNER_TEMP}/community-core-workers/${target}/bin/winwincode-kernel-helper"
          done

      - name: Build exact Community Core release inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          input_root="${RUNNER_TEMP}/community-core-inputs"
          cargo_root="${RUNNER_TEMP}/community-core-cargo"
          mkdir -p "${input_root}" "${cargo_root}"
          version="$(node -p "require('./package.json').version")"
          source_date_epoch="$(git show -s --format=%ct "${SOURCE_COMMIT}")"
          contract="docs/decisions/0031-community-core-release.json"

          mapfile -t crates < <(jq -r '.currentState.rustPackages.intendedLinkableCore[].name' "${contract}")
          cargo_args=(package --locked --no-verify)
          for crate in "${crates[@]}"; do
            cargo_args+=(-p "${crate}")
          done
          CARGO_TARGET_DIR="${cargo_root}" cargo "${cargo_args[@]}"
          for crate in "${crates[@]}"; do
            cp -f "${cargo_root}/package/${crate}-${version}.crate" "${input_root}/"
          done

          corepack pnpm build:ts
          jq -r '.currentState.npmPackages.packages[].manifest' "${contract}" |
            while IFS= read -r manifest; do
              npm pack "./$(dirname "${manifest}")" --pack-destination "${input_root}" --ignore-scripts
            done

          mapfile -t contract_paths < <(jq -r '
            .targetState.contractBundle |
            .canonicalSchemas[], .generatedContracts[], .protocolSamples[]
          ' "${contract}")
          git archive --format=tar HEAD -- "${contract_paths[@]}" |
            zstd --quiet -19 -T0 -o "${input_root}/winwincode-contracts-${version}.tar.zst"

          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu
          do
            tar \
              --sort=name \
              --format=ustar \
              --mtime="@${source_date_epoch}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "${RUNNER_TEMP}/community-core-workers/${target}" \
              -cf - \
              LICENSE NOTICE THIRD_PARTY_NOTICES.md bin |
              zstd --quiet -19 -T0 \
                -o "${input_root}/winwincode-worker-${version}-${target}.tar.zst"
          done

          printf 'input_root=%s\n' "${input_root}" >> "${GITHUB_OUTPUT}"
          printf 'source_date_epoch=%s\n' "${source_date_epoch}" >> "${GITHUB_OUTPUT}"

      - name: Finalize and sign Community Core release
        shell: bash
        env:
          WINWINCODE_CORE_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.WINWINCODE_CORE_RELEASE_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          corepack pnpm release:core-finalize \
            --input "${{ steps.inputs.outputs.input_root }}" \
            --output "${RUNNER_TEMP}/community-core-release" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-date-epoch "${{ steps.inputs.outputs.source_date_epoch }}"

      - name: Upload signed Community Core candidate
        uses: actions/upload-artifact@v7
        with:
          name: community-core-release-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/community-core-release/
          if-no-files-found: error
          compression-level: 0
