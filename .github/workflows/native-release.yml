name: Product release matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mainline-verification:
    name: Mainline verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils bubblewrap pkg-config libcap-dev
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,rust-src
          rustup override set 1.95.0
          rustc -Vv
          cargo -V

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify the complete workspace once
        shell: bash
        run: corepack pnpm verify

  product-release:
    name: ${{ matrix.target }}
    needs: mainline-verification
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils bubblewrap pkg-config libcap-dev
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --as-pid-1 -- true

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,rust-src
          rustup target add "${{ matrix.target }}" --toolchain 1.95.0
          rustup override set 1.95.0
          rustc -Vv
          cargo -V

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Build product release artifacts and write evidence
        shell: bash
        env:
          WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX }}
          WINWINCODE_HELPER_RELEASE_PUBLIC_KEY_HEX: ${{ vars.WINWINCODE_HELPER_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          node scripts/run-release-artifact-gate.mjs \
            --target ${{ matrix.target }} \
            --source-commit "${GITHUB_SHA}" \
            --source-date-epoch "$(git show -s --format=%ct "${GITHUB_SHA}")" \
            --output release-artifacts

      - name: Verify release artifact security
        shell: bash
        env:
          WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/helper-release-private-input"
          umask 077
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "${WINWINCODE_HELPER_RELEASE_PRIVATE_KEY_HEX}" > "$key_file"
          node scripts/verify-release-artifact-security.mjs \
            --target "${{ matrix.target }}" \
            --expected-commit "${GITHUB_SHA}" \
            --source-date-epoch "$(git show -s --format=%ct "${GITHUB_SHA}")" \
            --evidence release-artifacts \
            --output release-artifact-security-report.json \
            --sensitive-input "$key_file"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: release-artifacts/${{ matrix.target }}/
          if-no-files-found: error

      - name: Upload release artifact security report
        uses: actions/upload-artifact@v7
        with:
          name: release-security-${{ matrix.target }}
          path: release-artifact-security-report.json
          if-no-files-found: error
