[build]
target-dir = "target"

[term]
color = "always"
verbose = false

[env]
# The pinned V8 sandbox configuration has no upstream prebuilt archive.
V8_FROM_SOURCE = { value = "1", force = true }
NINJA = { value = "scripts/code-mode-ninja.mjs", relative = true, force = true }
# Code Mode initializes ICU from the pinned deno_core_icudata image.
# Temporal is disabled at runtime by upstream. Its native Rust build inputs
# are not shipped in this registry source; keep that experimental feature off.
# Keep the native engine optimized when compiling the host from source.
GN_ARGS = { value = "is_debug=false icu_use_data_file=true icu_copy_icudata_to_root_build_dir=false v8_enable_temporal_support=false", force = true }
