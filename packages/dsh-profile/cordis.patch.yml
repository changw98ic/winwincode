# WinWinCode is the final DSH Web composition layer. The built-in Chat view
# stays mounted and remains the default conversation view; this layer replaces
# only the AgentFactory execution boundary and adds the opt-in StrongFlow tab.

- id: agent-loop
  disabled: true

# The DSH host still owns model selection, settings, credentials, approvals,
# sessions, API registries, and presentation. Codex owns every operation that
# can execute a model-driven tool, sandbox command, child agent, or workflow.
- id: session-title-llm
  disabled: true

- id: llm-retry
  disabled: true

- id: subprocess
  disabled: true

- id: sandbox
  disabled: true

- id: sandbox-policy
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: permission
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: fs-observation-policy
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: goal-round-driver
  disabled: true

- id: command-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: subagent-spawn-in-process
  disabled: true

- id: subagent-fork-in-process
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-report
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: repeat-tool-reminder
  disabled: true

- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

- id: fs-sandbox
  disabled: true

- id: code-runtime
  disabled: true

# DSH's preset plane contains its own model-facing tools and prompt sections.
# The embedded Codex kernel owns those capabilities, so sessions use the host
# composition directly instead of mounting a second execution plane.
- id: agent-presets
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: ui-workflow-run
  disabled: true

- id: ui-subagent
  disabled: true

- id: ui-jobs
  disabled: true

- id: ui-goal
  disabled: true

- id: ui-permission
  disabled: true

- id: ui-plan
  disabled: true

- id: ui-trajectory
  disabled: true

- insert:
    - id: winwincode-agent-factory
      name: '@winwincode/dsh-profile/agent-factory'
      config:
        home: !!js dshHomePath('winwincode')
        roleId: chat

    # This adapter resolves GITHUB_TOKEN through DSH credentials for each
    # GitHub request. StrongFlow publication remains dry-run unless its caller
    # explicitly selects live mode after the exact human publication approval.
    - id: winwincode-github-publication-provider
      name: '@winwincode/dsh-profile/github-publication-provider'

    - id: winwincode-strongflow
      name: '@winwincode/strongflow'
      config:
        home: !!js dshHomePath('winwincode')
