[workspace]
members = [
  "crates/helper",
  "crates/kernel",
  "crates/native",
  "crates/winwincode-api",
  "crates/winwincode-delivery",
  "crates/winwincode-control-plane",
  "crates/winwincode-domain",
  "crates/winwincode-storage",
]
exclude = ["third_party/codex/codex-rs"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/changw98ic/winwincode"

[workspace.dependencies]
anyhow = "=1.0.103"
codex-core-api = { path = "third_party/codex/codex-rs/core-api" }
codex-api = { path = "third_party/codex/codex-rs/codex-api" }
codex-arg0 = { path = "third_party/codex/codex-rs/arg0" }
codex-protocol = { path = "third_party/codex/codex-rs/protocol" }
codex-sandboxing = { path = "third_party/codex/codex-rs/sandboxing" }
codex-utils-path-uri = { path = "third_party/codex/codex-rs/utils/path-uri" }
codex-model-provider-info = { path = "third_party/codex/codex-rs/model-provider-info" }
futures = "=0.3.31"
napi = { version = "=3.12.1", features = ["napi9", "serde-json", "tokio_rt", "web_stream"] }
napi-build = "=2.4.1"
napi-derive = "=3.6.3"
# 0.40.x requires libsqlite3-sys 0.38.x, which cannot coexist with the Codex/sqlx
# closure's libsqlite3-sys 0.37.x because both crates link the same native library.
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "sync", "time"] }
winwincode-domain = { path = "crates/winwincode-domain" }

[workspace.lints.rust]
# napi-rs marks its generated registration shims with `allow(unsafe_code)`.
# `deny` still rejects handwritten unsafe code while permitting those generated shims.
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
