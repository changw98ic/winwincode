[package]
name = "winwincode-device-client"
description = "Local device-client store and identity for the WinWinCode device client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["src/**", "tests/**", "Cargo.toml"]

[dependencies]
winwincode-network = { workspace = true, features = ["journal"] }
winwincode-api.workspace = true
winwincode-provider.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
http.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["parsing"] }
winwincode-client-port = { path = "../winwincode-client-port" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "signal"] }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
ureq = { version = "=3.1.4", default-features = false }

[lints]
workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["trace"] }
winwincode-worker = { path = "../winwincode-worker" }
