[package]
name = "winwincode-device-client"
description = "Local device-client store and identity for the WinWinCode device client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["src/**", "tests/**", "Cargo.toml"]

[dependencies]
getrandom.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# RFC 3339 stamps for exchange envelopes and durable cursors; the same
# formatting dependency the server side already uses. The `parsing` feature
# is required locally to compare stored code expiry stamps against the wall
# clock when answering access challenges.
time = { workspace = true, features = ["parsing"] }
# Direct path dependency on purpose: `winwincode-client-port` is not part of
# `[workspace.dependencies]`, matching how `winwincode-server` and
# `winwincode-local` reference sibling crates.
winwincode-client-port = { path = "../winwincode-client-port" }

[lints]
workspace = true

# Cross-validation (WORKER-200.2): the managed-session config this crate's
# supervisor writes must be accepted by the fail-closed reader of the real
# `winwincode-worker --managed-session` entry, so the reader runs against
# supervisor-written files in the launch tests.
[dev-dependencies]
winwincode-worker = { path = "../winwincode-worker" }
