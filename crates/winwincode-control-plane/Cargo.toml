[package]
name = "winwincode-control-plane"
description = "Application lifecycle host for the WinWinCode Control Plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["src/**", "tests/**", "Cargo.toml", "README.md"]

[features]
# Exposes deterministic trusted-authority fixture builders only to Rust tests.
# The production Control Plane keeps Delivery command facts opaque by default.
test-support = ["winwincode-publication/test-support"]

[dependencies]
aes-gcm = "=0.10.3"
base64.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "=3.1.4", default-features = false, features = ["rustls", "json"] }
winwincode-api.workspace = true
winwincode-audit.workspace = true
winwincode-delivery = { path = "../winwincode-delivery" }
winwincode-domain.workspace = true
winwincode-execution-port.workspace = true
winwincode-publication.workspace = true
winwincode-repository-context = { path = "../winwincode-repository-context" }
winwincode-session.workspace = true
winwincode-storage = { path = "../winwincode-storage" }

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true
rusqlite.workspace = true
winwincode-delivery = { path = "../winwincode-delivery", features = ["test-support"] }

[[test]]
name = "delivery_command_transaction"
required-features = ["test-support"]

[[test]]
name = "terminal_outcome_transaction"
required-features = ["test-support"]

[[test]]
name = "publication_policy"
required-features = ["test-support"]

[[test]]
name = "publication_cutover"
required-features = ["test-support"]

[[test]]
name = "publication_application"
required-features = ["test-support"]

[[test]]
name = "publication_production"
required-features = ["test-support"]

[[test]]
name = "publication_enterprise_usage"
required-features = ["test-support"]

[[test]]
name = "publication_enterprise_quota"
required-features = ["test-support"]

[[test]]
name = "product_session_execution_application"
required-features = ["test-support"]

[lints]
workspace = true
