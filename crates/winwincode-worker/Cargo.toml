[package]
name = "winwincode-worker"
description = "Standalone WinWinCode Execution Worker lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
test-support = ["winwincode-codex/test-support", "winwincode-provider/test-support"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "winwincode-worker"
path = "src/main.rs"

[[test]]
name = "production_vertical"
required-features = ["test-support"]

[dependencies]
winwincode-network = { workspace = true, features = ["reqwest", "journal"] }
winwincode-provider.workspace = true
base64.workspace = true
codex-apply-patch = { path = "../../third_party/codex/codex-rs/apply-patch" }
codex-exec-server = { path = "../../third_party/codex/codex-rs/exec-server" }
codex-protocol.workspace = true
sandboxing = { package = "codex-sandboxing", path = "../../third_party/codex/codex-rs/sandboxing" }
codex-utils-absolute-path = { path = "../../third_party/codex/codex-rs/utils/absolute-path" }
codex-utils-pty = { path = "../../third_party/codex/codex-rs/utils/pty" }
codex-utils-path-uri = { path = "../../third_party/codex/codex-rs/utils/path-uri" }
futures.workspace = true
rusqlite.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls.workspace = true
winwincode-codex = { path = "../winwincode-codex" }
winwincode-domain = { path = "../winwincode-domain" }
winwincode-execution-port = { path = "../winwincode-execution-port" }

[dev-dependencies]
rcgen.workspace = true
rusqlite.workspace = true
tempfile = "=3.27.0"
winwincode-api.workspace = true
winwincode-control-plane = { path = "../winwincode-control-plane", features = ["test-support"] }
winwincode-delivery = { path = "../winwincode-delivery", features = ["test-support"] }
winwincode-kernel = { path = "../kernel" }
winwincode-server = { path = "../winwincode-server", default-features = false }
winwincode-storage.workspace = true

[lints]
workspace = true
