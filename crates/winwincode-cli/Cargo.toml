[package]
name = "winwincode-cli"
description = "Canonical wwc repository setup, attachment, and diagnostics command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["src/**", "tests/**", "Cargo.toml", "README.md"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "wwc"
path = "src/main.rs"

[dependencies]
getrandom.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
winwincode-delivery = { path = "../winwincode-delivery" }
winwincode-domain.workspace = true
winwincode-evidence-export = { path = "../winwincode-evidence-export" }
winwincode-repository-context = { path = "../winwincode-repository-context" }
winwincode-server = { path = "../winwincode-server" }
winwincode-storage.workspace = true
winwincode-test-assets = { path = "../winwincode-test-assets" }

[dev-dependencies]
winwincode-delivery = { path = "../winwincode-delivery", features = ["test-support"] }

[lints]
workspace = true
