[package]
name = "winwincode-publication"
description = "Publication domain and durable external-effect coordinator for the WinWinCode Control Plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Exposes deterministic sealed facts only to Rust integration tests.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "=3.1.4", default-features = false, features = ["rustls", "json"] }
winwincode-domain.workspace = true
winwincode-storage = { path = "../winwincode-storage" }

[dev-dependencies]
rusqlite.workspace = true

[[test]]
name = "publication_coordinator"
required-features = ["test-support"]

[[test]]
name = "github_adapter"
required-features = ["test-support"]

[lints]
workspace = true
